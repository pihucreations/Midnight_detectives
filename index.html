<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blue Diamond Mystery</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101426;
  color:white;
  text-align:center;
}
#game{
  max-width:700px;
  margin:auto;
  padding:20px;
}
button,input{
  font-size:16px;
  padding:12px;
  margin:6px;
  border:0;
  border-radius:10px;
}
button{
  background:#e5c86b;
  cursor:pointer;
}
#choices button{
  display:block;
  width:80%;
  margin:10px auto;
}
#map{
  display:none;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:20px auto;
  max-width:500px;
}
.room{
  min-height:70px;
  background:#303750;
  border:2px solid #59617c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px;
}
.player{
  background:#e5c86b;
  color:#111;
  font-weight:bold;
}
#controls{
  display:none;
}
#inventory{
  margin:15px;
  padding:12px;
  background:#1c2138;
  border-radius:12px;
}
</style>
</head>

<body>

<div id="game">

<h1>💎 The Blue Diamond Mystery</h1>

<div id="story">
  <p>You arrive at the luxurious Blackwood Grand Hotel.</p>

  <input id="nameInput" placeholder="What is your name?">

  <button id="checkInBtn">Check in</button>
</div>

<div id="choices"></div>

<div id="map"></div>

<div id="controls">
  <button data-move="0,-1">⬆️</button><br>

  <button data-move="-1,0">⬅️</button>

  <button id="investigateBtn">🔎 Investigate</button>

  <button data-move="1,0">➡️</button><br>

  <button data-move="0,1">⬇️</button>
</div>

<p id="location"></p>

<div id="inventory">
  🎒 Evidence:
  <span id="evidence">None yet</span>
</div>

</div>

<script>
const story=document.getElementById("story");
const choices=document.getElementById("choices");
const map=document.getElementById("map");
const controls=document.getElementById("controls");
const locationText=document.getElementById("location");
const evidenceText=document.getElementById("evidence");

let player="";
let refusals=0;
let x=1;
let y=1;
let evidence=[];
let suspectStageStarted=false;

const rooms=[
  ["Room 12","Room 13","Library","Stairs"],
  ["Restaurant","Ballroom","Lounge","Garden"],
  ["Kitchen","Lobby","Lift","Office"],
  ["Storage","Hall","Bar","Exit"]
];

const clues={
  "Ballroom":
  "You find a torn piece of white glove under Lady Celestine's chair. 🧤",

  "Garden":
  "You find muddy footprints leading TOWARDS the hotel. 👣",

  "Kitchen":
  "A waiter says someone entered carrying a blue velvet bag.",

  "Room 13":
  "A note says: 'The thief never left the ballroom.' 😳",

  "Library":
  "The guest list shows four people were sitting close enough to reach the clutch.",

  "Office":
  "The security cameras were switched off for exactly seven minutes."
};

function show(text){
  story.innerHTML="<p>"+text+"</p>";
}

function buttons(list){
  choices.innerHTML="";

  list.forEach(item=>{
    const b=document.createElement("button");
    b.textContent=item[0];
    b.onclick=item[1];
    choices.appendChild(b);
  });
}

document.getElementById("checkInBtn").onclick=()=>{

  player=document.getElementById("nameInput").value.trim();

  if(!player){
    alert("Enter your name first!");
    return;
  }

  show(`
    Welcome to the Blackwood Grand Hotel, ${player}.<br><br>

    During dinner, a scream comes from the ballroom.<br><br>

    Lady Celestine Ashbourne, a wealthy aristocrat,
    is staring at her silver clutch.<br><br>

    The famous BLUE DIAMOND attached to it has vanished. 💎<br><br>

    "£1,000 to whoever finds it!" she announces.<br><br>

    Do you want to get involved?
  `);

  buttons([
    ["🔎 Yes, investigate",beginInvestigation],
    ["🙅 No, stay out of it",refuse]
  ]);
};

function refuse(){

  refusals++;

  if(refusals===1){

    show(`
      You stay out of it.<br><br>

      Later, hotel security knocks on your door.<br><br>

      A witness claims they saw someone matching your description
      near Lady Celestine before the diamond vanished. 😳<br><br>

      You are now a suspect.<br><br>

      Investigate to clear your name?
    `);

  }else if(refusals===2){

    show(`
      You STILL refuse. 😂<br><br>

      A note slides under your door:<br><br>

      <b>
      I KNOW YOU ARE INNOCENT.<br>
      I KNOW WHO TOOK THE DIAMOND.<br>
      MIDNIGHT. ROOM 13.
      </b><br><br>

      Will you investigate now?
    `);

  }else{

    show(`
      You ignore that too.<br><br>

      The next morning you open your suitcase...<br><br>

      💎 <b>THE BLUE DIAMOND IS INSIDE.</b><br><br>

      But it is FAKE.<br><br>

      Someone is trying to frame you.<br><br>

      Now you have to find the real diamond before security searches your room.
    `);

    buttons([
      ["😳 Fine! Investigate",beginInvestigation]
    ]);

    return;
  }

  buttons([
    ["🔎 Investigate",beginInvestigation],
    ["🙅 Still no",refuse]
  ]);
}

function beginInvestigation(){

  choices.innerHTML="";

  show(`
    <b>INVESTIGATION STARTED</b><br><br>

    Walk around the hotel using the arrows.<br>
    Press 🔎 Investigate in different rooms.<br><br>

    Find all 6 important clues.
  `);

  map.style.display="grid";
  controls.style.display="block";

  drawMap();
}

function drawMap(){

  map.innerHTML="";

  rooms.forEach((row,ry)=>{

    row.forEach((room,rx)=>{

      const square=document.createElement("div");

      square.className=
      "room"+(rx===x&&ry===y?" player":"");

      square.textContent=
      rx===x&&ry===y
      ?"🕵️ "+room
      :room;

      map.appendChild(square);
    });
  });

  locationText.textContent="You are in: "+rooms[y][x];
}

function move(dx,dy){

  const newX=x+dx;
  const newY=y+dy;

  if(newX<0||newX>3||newY<0||newY>3){
    return;
  }

  x=newX;
  y=newY;

  drawMap();
}

document.querySelectorAll("[data-move]").forEach(button=>{

  button.onclick=()=>{

    const values=button.dataset.move.split(",").map(Number);

    move(values[0],values[1]);
  };
});

document.getElementById("investigateBtn").onclick=investigate;

function investigate(){

  const room=rooms[y][x];

  if(clues[room]){

    show("<b>"+room+"</b><br><br>"+clues[room]);

    if(!evidence.includes(room)){

      evidence.push(room);

      evidenceText.textContent=evidence.join(", ");
    }

    if(evidence.length===6 && !suspectStageStarted){

      suspectStageStarted=true;

      setTimeout(showSuspects,700);
    }

  }else{

    show(`
      You search the ${room}.<br><br>
      Nothing important appears... yet.
    `);
  }
}

function showSuspects(){

  map.style.display="none";
  controls.style.display="none";

  show(`
    <b>You have collected all 6 clues.</b><br><br>

    Lady Celestine gathers everyone in the ballroom.<br><br>

    Four people could have taken the diamond.<br><br>

    Who do you want to question?
  `);

  buttons([
    ["🎹 The Pianist",()=>question("pianist")],
    ["🍷 The Head Waiter",()=>question("waiter")],
    ["🎭 The Actress",()=>question("actress")],
    ["🎩 Lady Celestine's Nephew",()=>question("nephew")]
  ]);
}

function question(person){

  const answers={

    pianist:
    "The pianist says: 'I was playing the piano from 9:00 until 9:30.'",

    waiter:
    "The waiter says: 'I went into the kitchen at 9:15, but I was carrying wine, not a blue bag.'",

    actress:
    "The actress says: 'I was in the garden until 9:20. My shoes were muddy.'",

    nephew:
    "The nephew says: 'I was in the library the whole time.'"
  };

  show(`
    ${answers[person]}<br><br>

    Question someone else, or make an accusation.
  `);

  buttons([
    ["🎹 Pianist",()=>question("pianist")],
    ["🍷 Waiter",()=>question("waiter")],
    ["🎭 Actress",()=>question("actress")],
    ["🎩 Nephew",()=>question("nephew")],
    ["🧠 Make an accusation",accusation]
  ]);
}

function accusation(){

  show(`
    <b>Who stole the Blue Diamond?</b><br><br>
    Choose carefully.
  `);

  buttons([
    ["🎹 Pianist",()=>ending("wrong")],
    ["🍷 Waiter",()=>ending("wrong")],
    ["🎭 Actress",()=>ending("wrong")],
    ["🎩 Nephew",()=>ending("correct")]
  ]);
}

function ending(result){

  choices.innerHTML="";

  if(result==="correct"){

    show(`
      🎉 <b>CASE SOLVED!</b><br><br>

      The nephew lied about being in the library.<br><br>

      He used the camera blackout to take the diamond
      and hid it in the blue velvet bag.<br><br>

      Lady Celestine gives you the £1,000 reward. 💷💎
    `);

  }else{

    show(`
      ❌ That person does not fit all the clues.<br><br>

      Try again.
    `);

    buttons([
      ["🔎 Question the suspects again",showSuspects]
    ]);
  }
}

document.addEventListener("keydown",event=>{

  if(event.key==="ArrowUp")move(0,-1);
  if(event.key==="ArrowDown")move(0,1);
  if(event.key==="ArrowLeft")move(-1,0);
  if(event.key==="ArrowRight")move(1,0);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Blue Diamond Mystery</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#11182b;
  color:white;
  text-align:center;
}

#game{
  max-width:750px;
  margin:auto;
  padding:20px;
}

button,
input{
  font-size:17px;
  padding:12px;
  margin:6px;
  border:0;
  border-radius:10px;
}

button{
  background:#e7c864;
  cursor:pointer;
}

.character{
  font-size:40px;
  background:#29324a;
  border:3px solid transparent;
}

.character.selected{
  border:3px solid gold;
  background:#485575;
}

#choices button{
  display:block;
  width:85%;
  margin:10px auto;
}

#ballroom{
  display:none;

  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,55px);

  gap:3px;

  max-width:600px;
  margin:20px auto;

  background:#755b42;
  padding:8px;

  border:5px solid #c6a45a;
  border-radius:12px;
}

.tile{
  background:#d7c6a4;
  display:flex;
  justify-content:center;
  align-items:center;

  font-size:27px;
  border-radius:5px;
}

.wall{
  background:#40372f;
}

#controls{
  display:none;
  margin-top:15px;
}

#talkButton{
  display:none;
  background:#70c88b;
}

#message{
  background:#1d253d;
  padding:15px;
  margin:15px auto;
  border-radius:12px;
  max-width:600px;
  min-height:60px;
}

.small{
  font-size:14px;
  color:#ccc;
}

</style>
</head>

<body>

<div id="game">

<h1>💎 The Blue Diamond Mystery</h1>

<div id="setup">

<h2>Who are you?</h2>

<input id="nameInput" placeholder="Enter your name">

<h3>Choose your character</h3>

<div id="characters">

<button class="character" data-character="👧🏻">👧🏻</button>
<button class="character" data-character="👦🏽">👦🏽</button>
<button class="character" data-character="👩🏾">👩🏾</button>
<button class="character" data-character="👨🏻">👨🏻</button>
<button class="character" data-character="🧑🏼">🧑🏼</button>
<button class="character" data-character="👩🏽">👩🏽</button>

</div>

<h3>Are you a child or an adult?</h3>

<button id="childButton">🧒 Child</button>
<button id="adultButton">🧑 Adult</button>

<h3>Why are you staying at the hotel?</h3>

<select id="reason">

<option value="holiday">🏖️ Holiday</option>
<option value="birthday">🎂 Birthday trip</option>
<option value="family">👨‍👩‍👧 Visiting family</option>
<option value="show">🎭 Seeing a show</option>
<option value="parent">🧳 Travelling with family</option>

</select>

<br><br>

<button id="startButton">🏨 Check into hotel</button>

</div>


<div id="story"></div>

<div id="choices"></div>


<div id="ballroom"></div>


<div id="controls">

<button data-move="0,-1">⬆️</button>

<br>

<button data-move="-1,0">⬅️</button>

<button id="talkButton">💬 Talk</button>

<button data-move="1,0">➡️</button>

<br>

<button data-move="0,1">⬇️</button>

</div>


<div id="message">
Create your character to begin.
</div>

</div>


<script>

/* -------------------------
PLAYER INFORMATION
------------------------- */

let playerName="";
let playerCharacter="";
let playerAge="";
let playerReason="";

let refusalCount=0;


/* -------------------------
CHARACTER CHOOSING
------------------------- */

const characterButtons=
document.querySelectorAll(".character");

characterButtons.forEach(button=>{

  button.addEventListener("click",()=>{

    characterButtons.forEach(b=>
      b.classList.remove("selected")
    );

    button.classList.add("selected");

    playerCharacter=
    button.dataset.character;

  });

});


document.getElementById("childButton")
.addEventListener("click",()=>{

  playerAge="child";

  document.getElementById("childButton").textContent=
  "✅ 🧒 Child";

  document.getElementById("adultButton").textContent=
  "🧑 Adult";

});


document.getElementById("adultButton")
.addEventListener("click",()=>{

  playerAge="adult";

  document.getElementById("adultButton").textContent=
  "✅ 🧑 Adult";

  document.getElementById("childButton").textContent=
  "🧒 Child";

});


/* -------------------------
START GAME
------------------------- */

document.getElementById("startButton")
.addEventListener("click",()=>{

  playerName=
  document.getElementById("nameInput")
  .value.trim();

  playerReason=
  document.getElementById("reason").value;


  if(!playerName){

    alert("Enter your name first!");

    return;
  }


  if(!playerCharacter){

    alert("Choose a character!");

    return;
  }


  if(!playerAge){

    alert("Choose child or adult!");

    return;
  }


  document.getElementById("setup")
  .style.display="none";


  hotelArrival();

});


/* -------------------------
HOTEL ARRIVAL
------------------------- */

function hotelArrival(){

  message(`
    ${playerCharacter} <b>${playerName}</b>
    arrives at the magnificent
    Blackwood Grand Hotel.
    <br><br>
    Huge chandeliers hang from the ceiling.
    A pianist plays in the ballroom.
    Waiters carry silver trays between the guests.
    <br><br>
    Then suddenly...
    <br><br>
    <b>AAAAAAAH!</b> 😱
  `);


  choices([
    [
      "😳 See what happened",
      diamondMissing
    ]
  ]);

}


/* -------------------------
DIAMOND DISAPPEARS
------------------------- */

function diamondMissing(){

  message(`
    Lady Celestine Ashbourne
    is standing beside her table.
    <br><br>

    👒 "MY DIAMOND!"
    <br><br>

    Attached to her silver clutch
    was the famous
    <b>Blue Ashbourne Diamond.</b>
    💎
    <br><br>

    It has vanished.
    <br><br>

    "£1,000 to whoever finds it!"
    she announces.
  `);


  if(playerAge==="child"){

    choices([
      [
        "🔎 I want to investigate!",
        guardianStopsYou
      ],

      [
        "😇 Stay out of it",
        guardianMystery
      ]
    ]);

  }else{

    choices([
      [
        "🔎 Investigate",
        startBallroom
      ],

      [
        "🙅 Stay out of it",
        adultRefuses
      ]
    ]);

  }

}


/* -------------------------
CHILD STORY
------------------------- */

function guardianStopsYou(){

  message(`
    Before you can even move...
    <br><br>

    🧑‍🧑‍🧒
    <b>Your guardian appears.</b>
    <br><br>

    "Absolutely NOT!"
    <br><br>

    "A valuable diamond has disappeared,
    hotel security is investigating,
    and you are staying right here."
    😑
    <br><br>

    You glance towards the ballroom.
    <br><br>

    Something VERY strange is happening there...
  `);


  choices([
    [
      "😇 Fine. I won't investigate.",
      guardianMystery
    ],

    [
      "🤔 But I could help!",
      guardianArgument
    ],

    [
      "🤫 Investigate secretly",
      secretInvestigation
    ]
  ]);

}


function guardianArgument(){

  message(`
    "I could help!"
    you say.
    <br><br>

    Your guardian folds their arms.
    <br><br>

    "No."
    <br><br>

    Then a waiter rushes past.
    <br><br>

    Something drops from his pocket.
    <br><br>

    🗝️
    <br><br>

    A tiny brass key.
    <br><br>

    He doesn't notice.
  `);


  choices([
    [
      "🗝️ Pick up the key",
      secretInvestigation
    ],

    [
      "😇 Leave it alone",
      guardianMystery
    ]
  ]);

}


function guardianMystery(){

  refusalCount++;

  message(`
    You agree not to investigate.
    <br><br>

    Five minutes later...
    <br><br>

    You walk back towards your hotel room.
    <br><br>

    Someone bumps into you.
    <br><br>

    A folded piece of paper
    appears inside your pocket.
    <br><br>

    It says:
    <br><br>

    <b>
    YOU DIDN'T TAKE THE DIAMOND.
    <br><br>
    BUT SOMEONE WANTS PEOPLE
    TO THINK YOU DID.
    </b>
    😳
  `);


  choices([
    [
      "😰 Show my guardian",
      showGuardianNote
    ],

    [
      "🤫 Keep it secret",
      secretInvestigation
    ]
  ]);

}


function showGuardianNote(){

  message(`
    Your guardian reads the note.
    <br><br>

    Their face changes.
    <br><br>

    "Okay..."
    <br><br>

    "We're going to find out
    what is happening.
    But you stay where I can see you."
    <br><br>

    Finally! 😏
  `);


  choices([
    [
      "🔎 Enter the ballroom",
      startBallroom
    ]
  ]);

}


function secretInvestigation(){

  message(`
    You wait until your guardian
    starts talking to hotel security.
    <br><br>

    Then...
    <br><br>

    ${playerCharacter}
    <b>${playerName}</b>
    quietly slips into the ballroom.
    🤫
  `);


  choices([
    [
      "🎮 Enter ballroom",
      startBallroom
    ]
  ]);

}


/* -------------------------
ADULT REFUSAL
------------------------- */

function adultRefuses(){

  message(`
    You decide this mystery
    is none of your business.
    <br><br>

    Sensible.
    <br><br>

    Probably.
    😏
    <br><br>

    Then hotel security approaches.
    <br><br>

    "A witness saw someone matching
    your description beside
    Lady Celestine's table."
    <br><br>

    You are now a suspect.
  `);


  choices([
    [
      "😳 Okay, investigate",
      startBallroom
    ]
  ]);

}


/* -------------------------
BALLROOM
------------------------- */

const ballroom=
document.getElementById("ballroom");

const controls=
document.getElementById("controls");

const talkButton=
document.getElementById("talkButton");


const width=7;
const height=6;


let playerX=3;
let playerY=5;


/*
NPC LOCATIONS
*/

const people=[

  {
    name:"Lady Celestine",
    icon:"👒",
    x:5,
    y:1,
    talk:talkCelestine
  },

  {
    name:"Pianist",
    icon:"🎹",
    x:1,
    y:1,
    talk:talkPianist
  },

  {
    name:"Head Waiter",
    icon:"🍷",
    x:5,
    y:4,
    talk:talkWaiter
  }

];


/*
Furniture
*/

const furniture=[

  {
    icon:"🪑",
    x:4,
    y:1
  },

  {
    icon:"🪑",
    x:4,
    y:2
  },

  {
    icon:"🍽️",
    x:5,
    y:2
  },

  {
    icon:"🌿",
    x:1,
    y:4
  }

];


function startBallroom(){

  document.getElementById("choices")
  .innerHTML="";


  message(`
    <b>THE BALLROOM</b>
    <br><br>

    Use the arrows to walk around.
    <br><br>

    Walk next to someone and
    the 💬 Talk button will appear.
  `);


  ballroom.style.display="grid";

  controls.style.display="block";

  drawBallroom();

}


/* -------------------------
DRAW ROOM
------------------------- */

function drawBallroom(){

  ballroom.innerHTML="";


  for(let y=0;y<height;y++){

    for(let x=0;x<width;x++){

      const tile=
      document.createElement("div");

      tile.className="tile";


      /*
      PLAYER
      */

      if(
        x===playerX &&
        y===playerY
      ){

        tile.textContent=
        playerCharacter;

      }else{

        /*
        PEOPLE
        */

        const person=
        people.find(p=>
          p.x===x &&
          p.y===y
        );


        /*
        FURNITURE
        */

        const object=
        furniture.find(f=>
          f.x===x &&
          f.y===y
        );


        if(person){

          tile.textContent=
          person.icon;

          tile.title=
          person.name;

        }else if(object){

          tile.textContent=
          object.icon;

        }

      }


      ballroom.appendChild(tile);

    }

  }


  checkForPerson();

}


/* -------------------------
MOVEMENT
------------------------- */

function move(dx,dy){

  const newX=
  playerX+dx;

  const newY=
  playerY+dy;


  if(
    newX<0 ||
    newX>=width ||
    newY<0 ||
    newY>=height
  ){

    return;

  }


  /*
  Don't walk THROUGH people.
  */

  const blocked=
  people.some(p=>
    p.x===newX &&
    p.y===newY
  );


  if(blocked){

    message(
      "Someone is standing there. Walk beside them to talk."
    );

    return;

  }


  playerX=newX;
  playerY=newY;


  drawBallroom();

}


/* -------------------------
ARROW BUTTONS
------------------------- */

document
.querySelectorAll("[data-move]")
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const moveAmount=
      button.dataset.move
      .split(",")
      .map(Number);

      move(
        moveAmount[0],
        moveAmount[1]
      );

    }
  );

});


/* -------------------------
WHO IS NEARBY?
------------------------- */

let nearbyPerson=null;


function checkForPerson(){

  nearbyPerson=null;


  people.forEach(person=>{

    const distance=

    Math.abs(
      playerX-person.x
    )

    +

    Math.abs(
      playerY-person.y
    );


    if(distance===1){

      nearbyPerson=
      person;

    }

  });


  if(nearbyPerson){

    talkButton.style.display=
    "inline-block";

    talkButton.textContent=
    "💬 Talk to "+
    nearbyPerson.name;

  }else{

    talkButton.style.display=
    "none";

  }

}


/* -------------------------
TALK BUTTON
------------------------- */

talkButton.addEventListener(
"click",
()=>{

  if(nearbyPerson){

    nearbyPerson.talk();

  }

});


/* -------------------------
CONVERSATIONS
------------------------- */

function talkCelestine(){

  message(`
    👒 <b>Lady Celestine</b>
    <br><br>

    "Oh! Are YOU searching
    for my diamond?"
    <br><br>

    She clutches her silver handbag.
    <br><br>

    Something about the clasp
    looks strange...
  `);


  conversationChoices([

    [
      "💎 When did you last see it?",
      ()=>{
        message(`
          👒 "At exactly 9:10.
          I checked it just before
          the pianist began his
          second song."
        `);
      }
    ],

    [
      "👀 Who was near you?",
      ()=>{
        message(`
          👒 "My nephew Sebastian,
          the actress Clara Vale,
          and several waiters."
        `);
      }
    ],

    [
      "👜 Examine the clutch",
      ()=>{
        message(`
          You look carefully.
          <br><br>

          The diamond wasn't
          simply unclipped.
          <br><br>

          The tiny metal chain
          has been CUT.
          ✂️
          <br><br>

          <b>That could be important.</b>
        `);
      }
    ]

  ]);

}


function talkPianist(){

  message(`
    🎹 <b>Marco Bellini</b>
    <br><br>

    "I saw nothing.
    I was playing all evening."
    <br><br>

    He keeps playing,
    but he seems nervous.
  `);


  conversationChoices([

    [
      "🎵 What were you playing?",
      ()=>{
        message(`
          🎹 "Moonlight Sonata.
          Then a waltz."
          <br><br>

          Interesting...
          Lady Celestine mentioned
          his second song.
        `);
      }
    ],

    [
      "👀 Did you leave the piano?",
      ()=>{
        message(`
          🎹 "No.
          Not once."
          <br><br>

          He answers VERY quickly.
          🤨
        `);
      }
    ]

  ]);

}


function talkWaiter(){

  message(`
    🍷 <b>Mr Harris</b>
    <br><br>

    "Terrible business.
    Absolutely terrible."
    <br><br>

    He keeps looking
    towards the ballroom doors.
  `);


  conversationChoices([

    [
      "🍷 Where were you?",
      ()=>{
        message(`
          🍷 "Serving drinks.
          Then I went to
          the kitchen at 9:15."
        `);
      }
    ],

    [
      "🗝️ Did you lose anything?",
      ()=>{
        message(`
          Mr Harris freezes.
          <br><br>

          🍷 "Lose anything?
          No... why?"
          <br><br>

          🤨 Suspicious.
        `);
      }
    ]

  ]);

}


/* -------------------------
DIALOGUE BUTTONS
------------------------- */

function conversationChoices(options){

  const box=
  document.getElementById("choices");

  box.innerHTML="";


  options.forEach(option=>{

    const button=
    document.createElement("button");

    button.textContent=
    option[0];

    button.addEventListener(
      "click",
      option[1]
    );

    box.appendChild(button);

  });


  const close=
  document.createElement("button");

  close.textContent=
  "⬅️ Stop talking";

  close.addEventListener(
    "click",
    ()=>{

      box.innerHTML="";

      message(
        "You continue exploring the ballroom."
      );

    }
  );


  box.appendChild(close);

}


/* -------------------------
HELPER FUNCTIONS
------------------------- */

function message(text){

  document.getElementById("message")
  .innerHTML=text;

}


function choices(options){

  const box=
  document.getElementById("choices");

  box.innerHTML="";


  options.forEach(option=>{

    const button=
    document.createElement("button");

    button.textContent=
    option[0];

    button.addEventListener(
      "click",
      option[1]
    );

    box.appendChild(button);

  });

}

</script>

</body>

</html>

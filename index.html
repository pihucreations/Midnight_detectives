<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Blue Diamond Mystery</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111827;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}

button,input,select{
 font:inherit;
 border:none;
 border-radius:10px;
 padding:9px 11px;
 margin:4px;
}

button{
 background:#e6c45e;
 cursor:pointer;
}

button:hover{filter:brightness(1.08)}

.hidden{display:none!important}

.panel{
 max-width:760px;
 margin:12px auto;
 padding:18px;
 background:#1f2b43;
 border-radius:16px;
}

h1{margin-bottom:8px}

.creatorRow{
 display:flex;
 justify-content:center;
 gap:7px;
 flex-wrap:wrap;
 margin:10px 0;
}

.choice{
 background:#34445f;
 color:white;
 border:2px solid transparent;
}

.choice.selected{
 border-color:#ffd96b;
 background:#536783;
}

.previewBox{
 width:130px;
 height:150px;
 margin:12px auto;
 background:#d7c6a6;
 border:5px solid #b89452;
 border-radius:14px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
}

#topbar{
 display:none;
 max-width:790px;
 margin:8px auto;
 padding:9px;
 background:#1f2b43;
 border-radius:12px;
 justify-content:space-around;
 gap:8px;
 flex-wrap:wrap;
}

#eventBar{
 max-width:790px;
 margin:8px auto;
 padding:8px;
 background:#493b61;
 border-radius:12px;
 display:none;
}

#roomName{
 font-size:23px;
 font-weight:bold;
 margin:10px;
}

#room{
 display:none;
 grid-template-columns:repeat(9,1fr);
 gap:3px;
 max-width:790px;
 margin:auto;
 padding:7px;
 background:#725338;
 border:5px solid #c6a45d;
 border-radius:14px;
}

.tile{
 height:58px;
 background:#d8c5a4;
 border-radius:5px;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
 overflow:hidden;
 font-size:26px;
}

.lobbyFloor{background:#dbc7a7}
.ballFloor{background:#d4bd8e}
.bedFloor{background:#cdbb9b}
.suiteFloor{background:#dfcba8}
.staffFloor{background:#b6b3a9}
.gardenFloor{background:#8fb67d}
.bathFloor{background:#c4d8dc}

.door{
 background:#795237;
 border:2px solid #5c3b27;
}

#controls{
 display:none;
 margin:9px;
}

#message{
 max-width:790px;
 min-height:105px;
 margin:10px auto;
 padding:15px;
 background:#1f2b43;
 border-radius:14px;
 line-height:1.5;
}

#choices{
 max-width:790px;
 margin:auto;
}

#choices button{
 display:block;
 width:94%;
 margin:6px auto;
}

.talk{background:#7fc98d}
.inspect{background:#76b9e7}
.special{background:#eea56e}
.listen{background:#d49ce5}

.overlay{
 display:none;
 max-width:840px;
 margin:12px auto;
 padding:16px;
 background:#f1e4bd;
 color:#222;
 border-radius:15px;
 text-align:left;
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
 gap:8px;
}

.card{
 background:white;
 padding:11px;
 border-radius:10px;
}

.current{outline:3px solid #397ad1}

.small{
 font-size:12px;
 opacity:.75;
}

.tabs{text-align:center}

.tabs button{
 background:#594630;
 color:white;
}

/* HUMAN */

.person{
 width:44px;
 height:53px;
 position:relative;
 transform-origin:bottom center;
}

.person.child{
 transform:scale(.83);
}

.head{
 position:absolute;
 width:19px;
 height:19px;
 left:12px;
 top:3px;
 background:var(--skin);
 border-radius:45%;
 z-index:2;
}

.hair{
 position:absolute;
 width:21px;
 height:10px;
 left:11px;
 top:1px;
 background:var(--hair);
 border-radius:12px 12px 4px 4px;
 z-index:3;
}

.hair.long:after{
 content:"";
 position:absolute;
 width:5px;
 height:16px;
 background:var(--hair);
 top:5px;
 right:0;
 border-radius:4px;
}

.hair.ponytail:after{
 content:"";
 position:absolute;
 width:8px;
 height:14px;
 background:var(--hair);
 right:-5px;
 top:4px;
 border-radius:50%;
}

.hair.curly{
 border-radius:50%;
 box-shadow:
 -4px 2px 0 var(--hair),
 4px 2px 0 var(--hair);
}

.eye{
 position:absolute;
 width:2px;
 height:2px;
 background:#222;
 top:10px;
 border-radius:50%;
 z-index:4;
}

.eye.a{left:17px}
.eye.b{left:24px}

.mouth{
 position:absolute;
 width:6px;
 height:2px;
 border-bottom:1px solid #7d4438;
 left:19px;
 top:16px;
 z-index:4;
}

.body{
 position:absolute;
 width:24px;
 height:21px;
 left:10px;
 top:23px;
 background:var(--shirt);
 border-radius:7px 7px 3px 3px;
}

.jacket:after{
 content:"";
 position:absolute;
 left:11px;
 top:23px;
 width:22px;
 height:20px;
 border-left:3px solid rgba(0,0,0,.18);
 border-right:3px solid rgba(0,0,0,.18);
 border-radius:5px;
}

.arm{
 position:absolute;
 width:5px;
 height:17px;
 top:25px;
 background:var(--skin);
 border-radius:4px;
}

.arm.a{left:6px;transform:rotate(6deg)}
.arm.b{right:6px;transform:rotate(-6deg)}

.leg{
 position:absolute;
 width:7px;
 height:11px;
 top:42px;
 background:var(--pants);
}

.leg.a{left:11px}
.leg.b{right:11px}

.tag{
 position:absolute;
 bottom:-3px;
 left:50%;
 transform:translateX(-50%);
 font-size:8px;
 color:#222;
 white-space:nowrap;
 max-width:63px;
 overflow:hidden;
 text-overflow:ellipsis;
}

.playerPerson{
 filter:drop-shadow(0 0 6px #126cff);
}

#scene{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(8,12,22,.95);
 z-index:50;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.sceneCard{
 max-width:650px;
 background:#1f2b43;
 padding:25px;
 border-radius:18px;
 line-height:1.55;
}

.scenePeople{
 font-size:40px;
 margin:12px;
}
</style>
</head>

<div class="previewBox">

</div>

<button class="special" onclick="startGame()">🧳 Arrive at Blackwood Grand</button>

</div>


<div id="topbar">

<button id="bedBtn" class="special hidden" onclick="goToBed()">🌙 Go to bed</button>

</div>

<div id="choices"></div>

<div id="message"></div>


<div id="map" class="overlay">

</div>

<div id="noteCards"></div>

<div style="text-align:center">

</div>

</div>

</div>

const player={
 name:"",

 skin:"#d9a27d",

 shirt:"#4779b8",
 pants:"#34425b",

function chooseAge(age){
 player.age=age;

 document.getElementById("ageChild").classList.toggle("selected",age==="child");
 document.getElementById("ageAdult").classList.toggle("selected",age==="adult");

 drawPreview();
}

function chooseSkin(colour){
 player.skin=colour;
 drawPreview();
}

function chooseHair(style){
 player.hairStyle=style;
 drawPreview();
}

function chooseHairColour(colour){
 player.hair=colour;
 drawPreview();
}

function chooseOutfit(outfit,shirt,pants){
 player.outfit=outfit;
 player.shirt=shirt;
 player.pants=pants;
 drawPreview();
}

function humanHTML(name,p,isPlayer=false){

 return `
 <div class="person ${p.child?"child":""} ${isPlayer?"playerPerson":""}"
 style="
 --skin:${p.skin};
 --hair:${p.hair};
 --shirt:${p.shirt};
 --pants:${p.pants};
 ">
   <div class="head"></div>
   <div class="hair ${p.hairStyle||"short"}"></div>
   <div class="eye a"></div>
   <div class="eye b"></div>
   <div class="mouth"></div>
   <div class="body ${p.outfit==="jacket"?"jacket":""}"></div>
   <div class="arm a"></div>
   <div class="arm b"></div>
   <div class="leg a"></div>
   <div class="leg b"></div>
   <div class="tag">${name}</div>
 </div>
 `;
}

function drawPreview(){

 document.getElementById("preview").innerHTML=
 humanHTML(
  player.name||"You",
  {
   skin:player.skin,
   hair:player.hair,
   hairStyle:player.hairStyle,
   shirt:player.shirt,
   pants:player.pants,
   outfit:player.outfit,
   child:player.age==="child"
  },
  true
 );
}

drawPreview();

function draw(){

 if(gameOver)return;

 const room=rooms[player.room];
 const board=document.getElementById("room");

 board.innerHTML="";

 document.getElementById("roomName").textContent=player.room;
 document.getElementById("dayText").textContent="Day "+day;
 document.getElementById("timeText").textContent=currentTime();
 document.getElementById("floorText").textContent=floorName(room.floor);

 document.getElementById("goalText").textContent=
 theft
 ? "💎 Solve the mystery"
 : "⭐ Gala tonight";

 for(let y=0;y<H;y++){

  for(let x=0;x<W;x++){

   const tile=document.createElement("div");
   tile.className="tile";

   if(room.type==="lobby")tile.classList.add("lobbyFloor");
   else if(room.type==="ballroom")tile.classList.add("ballFloor");
   else if(room.type==="bedroom")tile.classList.add("bedFloor");
   else if(room.type==="suite")tile.classList.add("suiteFloor");
   else if(room.type==="staff")tile.classList.add("staffFloor");
   else if(room.type==="garden")tile.classList.add("gardenFloor");
   else if(room.type==="bath")tile.classList.add("bathFloor");

   const object=room.objects.find(o=>o.x===x&&o.y===y);
   const door=room.doors.find(d=>d.x===x&&d.y===y);

   const npc=Object.entries(people).find(([name,p])=>
    !p.hidden &&
    p.room===player.room &&
    p.x===x &&
    p.y===y
   );

   if(player.x===x&&player.y===y){

    tile.innerHTML=humanHTML(
     player.name,
     {
      skin:player.skin,
      hair:player.hair,
      hairStyle:player.hairStyle,
      shirt:player.shirt,
      pants:player.pants,
      outfit:player.outfit,
      child:player.age==="child"
     },
     true
    );

   }else if(npc){

    tile.innerHTML=humanHTML(npc[0],npc[1]);

   }else if(object){

    tile.textContent=object.icon;

   }else if(door){

    tile.textContent=
    door.to.includes("Stair") ||
    door.to.includes("Landing")
    ? "🪜"
    : "🚪";

    tile.classList.add("door");
   }

   board.appendChild(tile);
  }
 }

 checkNearby();
 updateEventBar();
}


/* =========================
   MOVEMENT
========================= */

function blocked(room,x,y){

 if(room.objects.some(o=>o.x===x&&o.y===y)){
  return true;
 }

 if(Object.values(people).some(p=>
  !p.hidden &&
  p.room===player.room &&
  p.x===x &&
  p.y===y
 )){
  return true;
 }

 return false;
}


function movePlayer(dx,dy){

 if(paused||gameOver)return;

 clearChoices();

 const nx=player.x+dx;
 const ny=player.y+dy;

 if(nx<0||nx>=W||ny<0||ny>=H)return;

 const room=rooms[player.room];

 const door=room.doors.find(d=>d.x===nx&&d.y===ny);

 if(door){

  const destination=rooms[door.to];

  if(player.age==="child" && destination.type==="staff"){

   parentWarnings++;

   if(parentWarnings===1){

    message(`
    😬 You hear your parent behind you.

    <br><br>

    “${player.name}! That's staff only.”

    <br><br>

    You get away with a warning.
    `);

   }else if(parentWarnings===2){

    message(`
    😠 “${player.name}! We talked about this!”

    <br><br>

    Your parent is definitely keeping a closer eye on you now.
    `);

   }else{

    message(`
    😱 BUSTED.

    <br><br>

    Your parent catches you sneaking into another staff area.

    <br><br>

    You're marched back to your room.
    `);

    sendHome();
    advanceBlock();
    draw();
    return;
   }
  }

  player.room=door.to;
  player.x=door.sx;
  player.y=door.sy;

  if(mayaFollowing){
   bringMaya();
  }

  draw();
  return;
 }

 if(blocked(room,nx,ny))return;

 player.x=nx;
 player.y=ny;

 draw();
}

function currentTime(){

 const blocks=day===1?day1Blocks:normalBlocks;

 return blocks[Math.min(timeBlock,blocks.length-1)];
}


function advanceBlock(){

 timeBlock++;

 const blocks=day===1?day1Blocks:normalBlocks;

 if(timeBlock>=blocks.length){
  timeBlock=blocks.length-1;
 }

 runScheduledEvent();
}

function checkNearby(){

 nearbyPerson=null;

 Object.entries(people).forEach(([name,p])=>{

  if(p.hidden||p.room!==player.room)return;

  const d=Math.abs(player.x-p.x)+Math.abs(player.y-p.y);

  if(d===1)nearbyPerson=name;
 });

 rooms[player.room].objects.forEach(o=>{

  const d=Math.abs(player.x-o.x)+Math.abs(player.y-o.y);

  if(d===1)nearbyObject=o;
 });

 const talk=document.getElementById("talkBtn");
 const inspect=document.getElementById("inspectBtn");

 talk.classList.toggle("hidden",!nearbyPerson);
 inspect.classList.toggle("hidden",!nearbyObject);

 if(nearbyPerson)talk.textContent="💬 "+nearbyPerson;
 if(nearbyObject)inspect.textContent="🔎 "+nearbyObject.name;
}

 lastSeen[name]=player.room;

 if(people[name].background){
  backgroundPersonTalk(name);
  return;

 const options=[

 ];

/* =========================
   NPC LIFE
========================= */

function npcTick(){

 if(paused||gameOver)return;

 Object.entries(people).forEach(([name,p])=>{

  if(p.hidden)return;
  if(name==="Maya Bell"&&mayaFollowing)return;

  if(p.room!==player.room)return;

  lastSeen[name]=p.room;

  if(Math.random()>.45)return;

  const dirs=[
   [1,0],[-1,0],[0,1],[0,-1]
  ];

  const d=dirs[Math.floor(Math.random()*dirs.length)];

  const nx=p.x+d[0];
  const ny=p.y+d[1];

  if(nx<=0||nx>=W-1||ny<=0||ny>=H-1)return;

  const room=rooms[p.room];

  if(room.objects.some(o=>o.x===nx&&o.y===ny))return;

  if(nx===player.x&&ny===player.y)return;

  if(Object.values(people).some(other=>
   other!==p &&
   !other.hidden &&
   other.room===p.room &&
   other.x===nx &&
   other.y===ny
  ))return;

  p.x=nx;
  p.y=ny;
 });

 draw();
}

setInterval(npcTick,1400);

function bringMaya(){

 const maya=people["Maya Bell"];

 if(rooms[player.room].type==="staff")return;

 maya.room=player.room;

 const spots=[
  [player.x-1,player.y],
  [player.x+1,player.y],
  [player.x,player.y-1],
  [player.x,player.y+1]
 ];

 const room=rooms[player.room];

 const spot=spots.find(([x,y])=>
  x>0&&x<W-1&&y>0&&y<H-1 &&
  !room.objects.some(o=>o.x===x&&o.y===y)
 );

 if(spot){
  maya.x=spot[0];
  maya.y=spot[1];
 }
}

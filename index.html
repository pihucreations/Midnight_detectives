<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blue Diamond Mystery</title>

<style>
body{
  font-family:Arial;
  background:#101425;
  color:white;
  text-align:center;
  margin:0;
}
#game{
  max-width:700px;
  margin:auto;
  padding:20px;
}
button,input{
  padding:12px;
  margin:6px;
  font-size:16px;
  border-radius:10px;
  border:0;
}
button{cursor:pointer;background:#e2c875}
#choices button{display:block;margin:8px auto;width:80%}

/* HOTEL MAP */
#map{
  display:none;
  grid-template-columns:repeat(4,80px);
  gap:5px;
  justify-content:center;
  margin:20px;
}
.room{
  height:70px;
  background:#303650;
  border:2px solid #596080;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}
.player{
  background:#d4af37;
  color:#111;
  font-weight:bold;
}
#controls{display:none}
</style>
</head>

<body>
<div id="game">

<h1>💎 The Blue Diamond Mystery</h1>

<div id="story">
  <p>You have just arrived at the luxurious Blackwood Grand Hotel.</p>

  <input id="name" placeholder="What is your name?">
  <button onclick="start()">Check in</button>
</div>

<div id="choices"></div>

<div id="map"></div>

<div id="controls">
  <button onclick="move(0,-1)">⬆️</button><br>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="investigate()">🔎</button>
  <button onclick="move(1,0)">➡️</button><br>
  <button onclick="move(0,1)">⬇️</button>
</div>

<p id="location"></p>

</div>

<script>

let player="";
let refusals=0;
let x=1,y=1;

const rooms=[
 ["Room 12","Room 13","Library","Stairs"],
 ["Restaurant","Ballroom","Lounge","Garden"],
 ["Kitchen","Lobby","Lift","Office"],
 ["Storage","Hall","Bar","Exit"]
];

function say(text){
 document.getElementById("story").innerHTML="<p>"+text+"</p>";
}

function options(buttons){
 choices.innerHTML="";
 buttons.forEach(([text,action])=>{
   let b=document.createElement("button");
   b.textContent=text;
   b.onclick=action;
   choices.appendChild(b);
 });
}

function start(){
 player=name.value.trim();
 if(!player)return alert("Enter your name first!");

 say(
  `${player}, you check into the Blackwood Grand Hotel.
  That evening, a scream comes from the ballroom.<br><br>
  Lady Celestine Ashbourne, a wealthy aristocrat,
  discovers that the famous BLUE DIAMOND on her clutch has vanished. 💎
  <br><br>
  "£1,000 to whoever finds my diamond!" she announces.`
 );

 options([
  ["🔎 I'll investigate",begin],
  ["🙅 No thanks",refuse]
 ]);
}

function refuse(){
 refusals++;

 if(refusals===1){
  say(
   `You decide it is none of your business.<br><br>
   Later, hotel security knocks on your door.
   A guest claims they saw someone matching YOUR description
   beside Lady Celestine's table before the theft. 😳
   <br><br>You are now a suspect.`
  );
 }
 else if(refusals===2){
  say(
   `You still refuse.<br><br>
   A note slides beneath your hotel-room door:
   <br><br><b>
   I KNOW YOU ARE INNOCENT.<br>
   I KNOW WHO TOOK THE DIAMOND.<br>
   MIDNIGHT. ROOM 13.
   </b>`
  );
 }
 else{
  say(
   `You ignore that too. 😂<br><br>
   The next morning you open your suitcase...
   <br><br>💎 <b>THE BLUE DIAMOND IS INSIDE.</b>
   <br><br>
   Except when you examine it, you realise it is FAKE.
   Someone is trying to frame you.
   <br><br>
   You now need to find the real diamond before security searches your room.`
  );

  options([["😳 Fine! Investigate",begin]]);
  return;
 }

 options([
  ["🔎 Okay, I'll investigate",begin],
  ["🙅 Still no",refuse]
 ]);
}

function begin(){
 choices.innerHTML="";

 say(
  `<b>INVESTIGATION STARTED</b><br>
  Walk around the hotel.
  Press 🔎 when you want to investigate your current room.`
 );

 map.style.display="grid";
 controls.style.display="block";

 drawMap();
}

function drawMap(){
 map.innerHTML="";

 rooms.forEach((row,ry)=>
  row.forEach((room,rx)=>{
   let d=document.createElement("div");
   d.className="room"+(x===rx&&y===ry?" player":"");
   d.textContent=x===rx&&y===ry ? "🕵️ "+room : room;
   map.appendChild(d);
  })
 );

 location.textContent="You are in: "+rooms[y][x];
}

function move(dx,dy){
 let nx=x+dx, ny=y+dy;

 if(nx<0||nx>3||ny<0||ny>3)return;

 x=nx;
 y=ny;
 drawMap();
}

function investigate(){

 let room=rooms[y][x];

 const clues={

  "Ballroom":
  `You examine Lady Celestine's table.
   Her silver clutch is here, but the diamond setting is EMPTY.
   You find a torn piece of white fabric underneath the chair. 🧤`,

  "Garden":
  `Near the fountain you discover muddy footprints.
   Strangely, they lead TOWARDS the hotel, not away from it. 👣`,

  "Kitchen":
  `A waiter tells you someone entered the kitchen at 9:15 PM
   carrying a blue velvet bag.`,

  "Room 13":
  `The door is unlocked.
   Inside is an empty room... except for a note:
   <br><b>"The thief never left the ballroom."</b> 😳`,

  "Library":
  `You find the guest list.
   Four people were sitting close enough to Lady Celestine
   to reach her clutch.`,

  "Office":
  `The security log shows the ballroom cameras went offline
   for exactly 7 minutes.`

 };

 say(clues[room] ||
     `You search the ${room}, but nothing important jumps out... yet.`);

}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp")move(0,-1);
 if(e.key==="ArrowDown")move(0,1);
 if(e.key==="ArrowLeft")move(-1,0);
 if(e.key==="ArrowRight")move(1,0);
});

</script>
</body>
</html>

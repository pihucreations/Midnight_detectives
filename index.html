<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Blue Diamond Mystery</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#11182b;
  color:white;
  text-align:center;
}

#game{
  max-width:760px;
  margin:auto;
  padding:15px;
}

button,
input,
select{
  font-size:16px;
  padding:11px;
  margin:6px;
  border:0;
  border-radius:10px;
}

button{
  background:#e7c864;
  cursor:pointer;
}

.character{
  font-size:38px;
  background:#29324a;
  border:3px solid transparent;
}

.character.selected{
  border-color:gold;
}

#choices button{
  display:block;
  width:85%;
  margin:10px auto;
}

#roomName{
  font-size:22px;
  font-weight:bold;
  margin-top:15px;
}

#room{
  display:none;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  max-width:600px;
  margin:15px auto;
  padding:8px;
  background:#72573e;
  border:5px solid #c6a45a;
  border-radius:12px;
}

.tile{
  height:52px;
  background:#d8c8aa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  border-radius:5px;
}

.door{
  background:#765034;
}

#controls{
  display:none;
}

#talkButton,
#inspectButton{
  display:none;
}

#talkButton{
  background:#70c88b;
}

#inspectButton{
  background:#79aee8;
}

#message{
  max-width:600px;
  margin:15px auto;
  padding:15px;
  min-height:60px;
  background:#1d253d;
  border-radius:12px;
}

#evidenceBox{
  max-width:600px;
  margin:15px auto;
  padding:10px;
  background:#252d47;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="game">

<h1>💎 The Blue Diamond Mystery</h1>

<div id="setup">

  <h2>Create your character</h2>

  <input id="nameInput" placeholder="Enter your name">

  <h3>Choose your character</h3>

  <div>
    <button class="character" data-character="👧🏻">👧🏻</button>
    <button class="character" data-character="👦🏽">👦🏽</button>
    <button class="character" data-character="👩🏾">👩🏾</button>
    <button class="character" data-character="👨🏻">👨🏻</button>
    <button class="character" data-character="🧑🏼">🧑🏼</button>
    <button class="character" data-character="👩🏽">👩🏽</button>
  </div>

  <h3>Child or adult?</h3>

  <button id="childButton">🧒 Child</button>
  <button id="adultButton">🧑 Adult</button>

  <h3>Why are you staying here?</h3>

  <select id="reason">
    <option>🏖️ Holiday</option>
    <option>🎂 Birthday trip</option>
    <option>👨‍👩‍👧 Visiting family</option>
    <option>🎭 Seeing a show</option>
    <option>🧳 Travelling with family</option>
  </select>

  <br><br>

  <button id="startButton">🏨 Check into hotel</button>

</div>

<div id="choices"></div>

<div id="roomName"></div>

<div id="room"></div>

<div id="controls">

  <button data-move="0,-1">⬆️</button>

  <br>

  <button data-move="-1,0">⬅️</button>

  <button id="talkButton">💬 Talk</button>

  <button id="inspectButton">🔎 Inspect</button>

  <button data-move="1,0">➡️</button>

  <br>

  <button data-move="0,1">⬇️</button>

</div>

<div id="message">
Create your character to begin.
</div>

<div id="evidenceBox">
🎒 Evidence:
<span id="evidence">Nothing yet</span>
</div>

</div>

<script>

const setup = document.getElementById("setup");
const nameInput = document.getElementById("nameInput");
const childButton = document.getElementById("childButton");
const adultButton = document.getElementById("adultButton");
const startButton = document.getElementById("startButton");

const roomElement = document.getElementById("room");
const roomNameElement = document.getElementById("roomName");
const controls = document.getElementById("controls");

const talkButton = document.getElementById("talkButton");
const inspectButton = document.getElementById("inspectButton");

const choicesBox = document.getElementById("choices");
const messageBox = document.getElementById("message");
const evidenceBox = document.getElementById("evidence");

let playerName = "";
let playerCharacter = "";
let playerAge = "";

let currentRoom = "Ballroom";

let playerX = 3;
let playerY = 4;

let nearbyPerson = null;
let nearbyObject = null;

let evidence = [];

const width = 7;
const height = 6;


/* -----------------------
CHARACTER CREATOR
----------------------- */

document.querySelectorAll(".character").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".character").forEach(other => {
      other.classList.remove("selected");
    });

    button.classList.add("selected");

    playerCharacter = button.dataset.character;

  });

});


childButton.addEventListener("click", () => {

  playerAge = "child";

  childButton.textContent = "✅ 🧒 Child";
  adultButton.textContent = "🧑 Adult";

});


adultButton.addEventListener("click", () => {

  playerAge = "adult";

  adultButton.textContent = "✅ 🧑 Adult";
  childButton.textContent = "🧒 Child";

});


startButton.addEventListener("click", () => {

  playerName = nameInput.value.trim();

  if(playerName === ""){
    alert("Enter your name first!");
    return;
  }

  if(playerCharacter === ""){
    alert("Choose a character!");
    return;
  }

  if(playerAge === ""){
    alert("Choose child or adult!");
    return;
  }

  setup.style.display = "none";

  startStory();

});


/* -----------------------
STORY
----------------------- */

function startStory(){

  showMessage(`
    ${playerCharacter} <b>${playerName}</b> arrives at the
    Blackwood Grand Hotel.
    <br><br>

    Suddenly...
    <br><br>

    😱 <b>"MY DIAMOND!"</b>
    <br><br>

    Lady Celestine's famous blue diamond has vanished.
    💎
  `);

  if(playerAge === "child"){

    showChoices([
      ["🔎 Investigate", guardianStops],
      ["😇 Stay out of it", mysteriousNote]
    ]);

  }else{

    showChoices([
      ["🔎 Investigate", enterHotel],
      ["🙅 Stay out of it", adultSuspect]
    ]);

  }

}


function guardianStops(){

  showMessage(`
    🧑‍🧑‍🧒 <b>Your guardian:</b>
    <br><br>

    "Absolutely not!"
    😑
    <br><br>

    "You are not investigating a stolen diamond."
  `);

  showChoices([
    ["🤫 Sneak away", enterHotel],
    ["😇 Okay...", mysteriousNote]
  ]);

}


function mysteriousNote(){

  showMessage(`
    You walk away.
    <br><br>

    Then you notice a folded note.
    <br><br>

    📜
    <br><br>

    <b>
    YOU ARE IN DANGER.
    <br>
    GO TO ROOM 13.
    </b>
  `);

  showChoices([
    ["😳 Investigate", enterHotel]
  ]);

}


function adultSuspect(){

  showMessage(`
    You decide to stay out of it.
    <br><br>

    Then hotel security approaches.
    <br><br>

    "A witness saw someone matching your description
    near Lady Celestine."
    😳
  `);

  showChoices([
    ["🔎 Investigate", enterHotel]
  ]);

}


/* -----------------------
ROOM DATA
----------------------- */

const rooms = {

  Ballroom: {

    people: [
      {
        name:"Lady Celestine",
        icon:"👒",
        x:5,
        y:1,
        text:`
          👒 <b>Lady Celestine</b>
          <br><br>
          "Someone cut the diamond from my clutch!"
        `
      },

      {
        name:"Marco",
        icon:"🎹",
        x:1,
        y:1,
        text:`
          🎹 <b>Marco the Pianist</b>
          <br><br>
          "I never left the piano."
          <br><br>
          He looks nervous. 🤨
        `
      }
    ],

    objects: [
      {
        name:"Silver Clutch",
        icon:"👜",
        x:5,
        y:2,
        clue:"✂️ Cut diamond chain",
        text:`
          👜 You inspect the clutch.
          <br><br>
          The chain wasn't opened.
          <br><br>
          It was <b>cut</b>. ✂️
        `
      }
    ],

    doors: [
      {x:3,y:0,to:"Library",startX:3,startY:4},
      {x:6,y:3,to:"Garden",startX:1,startY:3},
      {x:0,y:3,to:"Kitchen",startX:5,startY:3}
    ]

  },


  Library: {

    people: [
      {
        name:"Sebastian",
        icon:"🎩",
        x:2,
        y:2,
        text:`
          🎩 <b>Sebastian</b>
          <br><br>
          "I was in the library all evening."
          <br><br>
          Hmm... 👀
        `
      }
    ],

    objects: [
      {
        name:"Library Record",
        icon:"📖",
        x:5,
        y:1,
        clue:"📖 Sebastian's library record",
        text:`
          📖 The record says:
          <br><br>
          Sebastian borrowed a book at 8:40.
          <br>
          He returned it at <b>8:55.</b>
          <br><br>
          So he was NOT here all evening. 😳
        `
      }
    ],

    doors: [
      {x:3,y:5,to:"Ballroom",startX:3,startY:1},
      {x:6,y:3,to:"Room 13",startX:1,startY:3}
    ]

  },


  Garden: {

    people: [
      {
        name:"Clara",
        icon:"🎭",
        x:4,
        y:2,
        text:`
          🎭 <b>Clara Vale</b>
          <br><br>
          "Yes, I was in the garden.
          That's why my shoes are muddy."
        `
      }
    ],

    objects: [
      {
        name:"Footprints",
        icon:"👣",
        x:2,
        y:3,
        clue:"👣 Footprints leading inside",
        text:`
          👣 Muddy footprints.
          <br><br>
          They lead <b>towards</b> the hotel.
          <br><br>
          Not away from it. 🤔
        `
      }
    ],

    doors: [
      {x:0,y:3,to:"Ballroom",startX:5,startY:3}
    ]

  },


  Kitchen: {

    people: [
      {
        name:"Mr Harris",
        icon:"🍷",
        x:2,
        y:2,
        text:`
          🍷 <b>Mr Harris</b>
          <br><br>
          "I was serving drinks all evening."
          <br><br>
          He keeps looking at the blue bag. 👀
        `
      }
    ],

    objects: [
      {
        name:"Blue Bag",
        icon:"🛍️",
        x:4,
        y:1,
        clue:"🛍️ Blue velvet bag",
        text:`
          🛍️ You inspect the blue velvet bag.
          <br><br>
          Something shiny is caught inside the lining.
          ✨
        `
      }
    ],

    doors: [
      {x:6,y:3,to:"Ballroom",startX:1,startY:3}
    ]

  },


  "Room 13": {

    people: [],

    objects: [
      {
        name:"Secret Note",
        icon:"📜",
        x:2,
        y:1,
        clue:"📜 Code 413",
        text:`
          📜 The note says:
          <br><br>
          <b>4 - 1 - 3</b>
          <br><br>
          A code?
          😈
        `
      },

      {
        name:"Locked Box",
        icon:"📦",
        x:4,
        y:2,
        special:"box"
      }
    ],

    doors: [
      {x:0,y:3,to:"Library",startX:5,startY:3}
    ]

  }

};


/* -----------------------
ENTER HOTEL
----------------------- */

function enterHotel(){

  clearChoices();

  currentRoom = "Ballroom";

  playerX = 3;
  playerY = 4;

  roomElement.style.display = "grid";
  controls.style.display = "block";

  showMessage(`
    🎮 <b>Investigation started!</b>
    <br><br>

    Use the arrows to walk.
    <br>
    🚪 Walk onto doors.
    <br>
    💬 Stand beside people.
    <br>
    🔎 Stand beside objects.
  `);

  drawRoom();

}


/* -----------------------
DRAW ROOM
----------------------- */

function drawRoom(){

  roomElement.innerHTML = "";

  roomNameElement.textContent = "🏨 " + currentRoom;

  const data = rooms[currentRoom];

  for(let y=0; y<height; y++){

    for(let x=0; x<width; x++){

      const tile = document.createElement("div");

      tile.className = "tile";

      const person = data.people.find(p => p.x === x && p.y === y);
      const object = data.objects.find(o => o.x === x && o.y === y);
      const door = data.doors.find(d => d.x === x && d.y === y);

      if(playerX === x && playerY === y){

        tile.textContent = playerCharacter;

      }else if(person){

        tile.textContent = person.icon;

      }else if(object){

        tile.textContent = object.icon;

      }else if(door){

        tile.textContent = "🚪";
        tile.classList.add("door");

      }

      roomElement.appendChild(tile);

    }

  }

  checkNearby();

}


/* -----------------------
MOVEMENT
----------------------- */

function move(dx,dy){

  const newX = playerX + dx;
  const newY = playerY + dy;

  if(
    newX < 0 ||
    newX >= width ||
    newY < 0 ||
    newY >= height
  ){
    return;
  }

  const data = rooms[currentRoom];

  const personThere =
    data.people.find(p => p.x === newX && p.y === newY);

  const objectThere =
    data.objects.find(o => o.x === newX && o.y === newY);

  if(personThere || objectThere){
    return;
  }

  const doorThere =
    data.doors.find(d => d.x === newX && d.y === newY);

  if(doorThere){

    currentRoom = doorThere.to;
    playerX = doorThere.startX;
    playerY = doorThere.startY;

    clearChoices();

    showMessage(`
      🚪 You enter the <b>${currentRoom}</b>.
    `);

    drawRoom();

    return;
  }

  playerX = newX;
  playerY = newY;

  drawRoom();

}


/* -----------------------
MOVEMENT BUTTONS
----------------------- */

document.querySelectorAll("[data-move]").forEach(button => {

  button.addEventListener("click", () => {

    const parts = button.dataset.move.split(",");

    const dx = Number(parts[0]);
    const dy = Number(parts[1]);

    move(dx,dy);

  });

});


/* -----------------------
NEARBY PEOPLE + OBJECTS
----------------------- */

function checkNearby(){

  nearbyPerson = null;
  nearbyObject = null;

  const data = rooms[currentRoom];

  for(const person of data.people){

    const distance =
      Math.abs(playerX - person.x) +
      Math.abs(playerY - person.y);

    if(distance === 1){
      nearbyPerson = person;
      break;
    }

  }

  for(const object of data.objects){

    const distance =
      Math.abs(playerX - object.x) +
      Math.abs(playerY - object.y);

    if(distance === 1){
      nearbyObject = object;
      break;
    }

  }

  if(nearbyPerson){

    talkButton.style.display = "inline-block";
    talkButton.textContent = "💬 " + nearbyPerson.name;

  }else{

    talkButton.style.display = "none";

  }

  if(nearbyObject){

    inspectButton.style.display = "inline-block";
    inspectButton.textContent = "🔎 " + nearbyObject.name;

  }else{

    inspectButton.style.display = "none";

  }

}


/* -----------------------
TALK
----------------------- */

talkButton.addEventListener("click", () => {

  if(!nearbyPerson){
    return;
  }

  clearChoices();

  showMessage(nearbyPerson.text);

});


/* -----------------------
INSPECT
----------------------- */

inspectButton.addEventListener("click", () => {

  if(!nearbyObject){
    return;
  }

  if(nearbyObject.special === "box"){

    lockedBox();

    return;
  }

  showMessage(nearbyObject.text);

  if(nearbyObject.clue){
    addEvidence(nearbyObject.clue);
  }

});


/* -----------------------
LOCKED BOX
----------------------- */

function lockedBox(){

  showMessage(`
    📦 The box has three number wheels.
    <br><br>
    What code will you try?
  `);

  showChoices([
    ["413", openBox],
    ["431", wrongCode],
    ["314", wrongCode],
    ["134", wrongCode]
  ]);

}


function wrongCode(){

  showMessage(`
    ❌ Wrong code.
    <br><br>
    Try again.
  `);

}


function openBox(){

  clearChoices();

  showMessage(`
    🔓 <b>CLICK!</b>
    <br><br>

    Inside is a torn white glove.
    🧤
    <br><br>

    That's suspicious...
  `);

  addEvidence("🧤 Torn white glove");

}


/* -----------------------
EVIDENCE
----------------------- */

function addEvidence(clue){

  if(!evidence.includes(clue)){
    evidence.push(clue);
  }

  if(evidence.length === 0){

    evidenceBox.textContent = "Nothing yet";

  }else{

    evidenceBox.textContent = evidence.join(" | ");

  }

}


/* -----------------------
HELPERS
----------------------- */

function showMessage(text){
  messageBox.innerHTML = text;
}


function clearChoices(){
  choicesBox.innerHTML = "";
}


function showChoices(options){

  clearChoices();

  options.forEach(option => {

    const button = document.createElement("button");

    button.textContent = option[0];

    button.addEventListener("click", option[1]);

    choicesBox.appendChild(button);

  });

}

</script>

</body>
</html>

<html lang="en">

<meta charset="utf-8" />

<title>The Blue Diamond Mystery</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0f1728;
 color:#fff;
 font-family:Arial,sans-serif;
 text-align:center
}
button,input,select{
 font:inherit;
 border:0;
 border-radius:10px;
 padding:9px 11px;
 margin:4px
}
button{background:#e7c762;cursor:pointer}
button:disabled{opacity:.45}
.hidden{display:none!important}

.panel{
 max-width:760px;
 margin:12px auto;
 padding:16px;
 background:#1c2942;
 border-radius:14px
}

#topbar{
 display:none;
 max-width:760px;
 margin:8px auto;
 padding:9px;
 background:#1c2942;
 border-radius:12px;
 justify-content:space-around;
 gap:8px;
 flex-wrap:wrap
}

#roomName{
 font-size:22px;
 font-weight:700;
 margin:10px
}

#room{
 display:none;
 grid-template-columns:repeat(9,1fr);
 gap:3px;
 max-width:760px;
 margin:auto;
 padding:6px;
 background:#70543a;
 border:4px solid #c7a35a;
 border-radius:14px
}

.tile{
 height:56px;
 background:#d8c6a4;
 border-radius:5px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
 font-size:25px
}

.garden{background:#9cbe83}
.staff{background:#b9b4aa}
.suite{background:#e0cfac}
.bath{background:#c7d8dc}
.door{background:#765036}
.stairs{background:#aa9271}

#controls{display:none;margin:9px}

#message{
 max-width:760px;
 min-height:90px;
 margin:10px auto;
 padding:14px;
 background:#1c2942;
 border-radius:12px;
 line-height:1.45
}

#choices{
 max-width:760px;
 margin:auto
}

#choices button{
 display:block;
 width:94%;
 margin:6px auto
}

.good{background:#7cc98c}
.info{background:#76b7e8}
.warn{background:#eca66e}
.listen{background:#d59ae9}

.overlay{
 display:none;
 max-width:820px;
 margin:12px auto;
 padding:15px;
 background:#efe1b8;
 color:#222;
 border-radius:14px;
 text-align:left
}

.tabs{text-align:center}

.tabs button{
 background:#5e4932;
 color:#fff
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:8px
}

.card{
 background:#fff;
 padding:10px;
 border-radius:10px
}

.current{
 outline:3px solid #347bd3
}

.small{
 font-size:12px;
 opacity:.75
}

/* PEOPLE */

.person{
 width:42px;
 height:52px;
 position:relative;
 transform-origin:bottom center
}

.person.child{
 transform:scale(.82)
}

.head{
 position:absolute;
 width:18px;
 height:18px;
 left:12px;
 top:3px;
 background:var(--skin);
 border-radius:45%
}

.hair{
 position:absolute;
 width:20px;
 height:9px;
 left:11px;
 top:1px;
 background:var(--hair);
 border-radius:10px 10px 3px 3px
}

.body{
 position:absolute;
 width:23px;
 height:21px;
 left:9px;
 top:22px;
 background:var(--shirt);
 border-radius:6px
}

.arm{
 position:absolute;
 width:5px;
 height:17px;
 top:24px;
 background:var(--skin);
 border-radius:4px
}

.arm.a{
 left:5px;
 transform:rotate(7deg)
}

.arm.b{
 right:5px;
 transform:rotate(-7deg)
}

.leg{
 position:absolute;
 width:7px;
 height:11px;
 top:42px;
 background:var(--pants)
}

.leg.a{left:10px}
.leg.b{right:10px}

.eye{
 position:absolute;
 width:2px;
 height:2px;
 top:10px;
 background:#222;
 border-radius:50%;
 z-index:2
}

.eye.a{left:17px}
.eye.b{left:24px}

.tag{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
 bottom:-2px;
 font-size:8px;
 color:#222;
 white-space:nowrap;
 max-width:60px;
 overflow:hidden;
 text-overflow:ellipsis
}

.player{
 filter:drop-shadow(0 0 5px #1d70ff)
}

#banner{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(8,12,22,.95);
 z-index:50;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 padding:25px
}

<div id="banner"></div>

<div id="app">

<h1>💎 The Blue Diamond Mystery</h1>

<div id="start" class="panel">

You have three hotel days.
On the first evening, Lady Celestine will show everyone

<br>

<span id="floorLabel"></span>

<div id="controls">

<button id="inspectBtn" class="info hidden" onclick="inspectObject()">

<button id="listenBtn" class="listen hidden" onclick="listenAtDoor()">

<button onclick="movePlayer(0,1)">⬇️</button>

<br>

<button onclick="openMap()">🗺️ Map</button>
<button onclick="openNotebook()">📓 Notebook</button>

<button id="bedBtn" class="warn hidden" onclick="goToBed()">

</button>

</div>

<div id="choices"></div>

<div id="message">
Check in to begin.
</div>


<div id="map" class="overlay">

<div id="mapCards" class="cards"></div>

<div style="text-align:center">
<button onclick="closeMap()">Back</button>
</div>

</div>


<div id="notebook" class="overlay">

<h2>📓 Notebook</h2>

</div>

<div id="noteCards"></div>

<div style="text-align:center">
<button onclick="closeNotebook()">Back</button>

</div>

</div>

function isBlocked(room,x,y){

 const objectBlocked=
 room.objects.some(o=>o.x===x&&o.y===y);

 const personBlocked=
 Object.values(people).some(p=>
  !p.hidden &&
  p.room===player.room &&
  p.x===x &&
  p.y===y
 );

 return objectBlocked || personBlocked;
}


function movePlayer(dx,dy){

 if(gameOver || paused){
  return;
 }

 clearChoices();

 const nx=player.x+dx;
 const ny=player.y+dy;

 if(nx<0 || nx>=W || ny<0 || ny>=H){
  return;
 }

 const room=rooms[player.room];

 const door=
 room.doors.find(d=>d.x===nx&&d.y===ny);

 if(door){

  const destination=
  rooms[door.to];

  if(
   player.age==='child' &&
   destination.type==='staff'
  ){

   parentWarnings++;

   if(parentWarnings===1){

    message(`
    😬 Your parent calls after you:

    <br><br>

    “Stay out of staff-only areas!”
    `);

   }else if(parentWarnings===2){

    message(`
    😠 Your parent catches you near
    another staff area.

    <br><br>

    “I already warned you.”
    `);

   }else{

    message(`
    😱 Caught again.

    <br><br>

    Your parent marches you back to your room.

    <br><br>

    You lose 20 minutes.
    `);

    sendHome();

    minutes+=20;

    draw();

    return;
   }
  }

  player.room=door.to;
  player.x=door.sx;
  player.y=door.sy;

  advanceTime(3);

  if(mayaFollow){
   moveMayaWithPlayer();
  }

  draw();

  return;
 }

 if(isBlocked(room,nx,ny)){
  return;
 }

 player.x=nx;
 player.y=ny;

 advanceTime(1);

 draw();
}

}

/* =====================
   NPC WALKING
===================== */

function npcTick(){

 if(
  paused ||
  gameOver ||
  !document.getElementById('start')
   .classList.contains('hidden')
 ){
  return;
 }

 for(const [name,p] of Object.entries(people)){

  if(p.hidden){
   continue;
  }

  if(
   name==='Maya Bell' &&
   mayaFollow
  ){
   continue;
  }

  /*
   IF YOU CAN SEE THEM:
   they walk one square instead of teleporting.
  */

  if(p.room===player.room){

   lastSeen[name]=p.room;

   const directions=[
    [1,0],
    [-1,0],
    [0,1],
    [0,-1]
   ];

   const d=
   directions[
    Math.floor(
     Math.random()*directions.length
    )
   ];

   const nx=p.x+d[0];
   const ny=p.y+d[1];

   const room=rooms[p.room];

   const hitsObject=
   room.objects.some(o=>
    o.x===nx &&
    o.y===ny
   );

   const hitsPlayer=
   nx===player.x &&
   ny===player.y;

   const hitsPerson=
   Object.values(people).some(other=>
    other!==p &&
    !other.hidden &&
    other.room===p.room &&
    other.x===nx &&
    other.y===ny
   );

   if(
    nx>0 &&
    nx<W-1 &&
    ny>0 &&
    ny<H-1 &&
    !hitsObject &&
    !hitsPlayer &&
    !hitsPerson
   ){

    p.x=nx;
    p.y=ny;
   }

  }else if(Math.random()<0.08){

   /*
   OFFSCREEN:
   characters continue their hotel routine.
  */

   p.routeIndex=
   ((p.routeIndex||0)+1) %
   p.route.length;

   p.room=
   p.route[p.routeIndex];

   p.x=
   1+Math.floor(Math.random()*7);

   p.y=
   1+Math.floor(Math.random()*5);
  }
 }

 draw();
}


setInterval(npcTick,1200);

function moveMayaWithPlayer(){

 const maya=
 people['Maya Bell'];

 if(
  rooms[player.room].type==='staff' ||
  player.room==="Mrs Bell's Room" ||
  player.room==="Lady Celestine's Suite"
 ){
  return;
 }

 maya.room=player.room;

 const possible=[
  [player.x-1,player.y],
  [player.x+1,player.y],
  [player.x,player.y-1],
  [player.x,player.y+1]
 ];

 const room=
 rooms[player.room];

 const spot=
 possible.find(([x,y])=>

  x>0 &&
  x<W-1 &&
  y>0 &&
  y<H-1 &&

  !room.objects.some(o=>
   o.x===x &&
   o.y===y
  )
 );

 if(spot){

  maya.x=spot[0];
  maya.y=spot[1];
 }
}

function checkNearby(){

 nearbyPerson=null;
 nearbyObject=null;

 for(const [name,p] of Object.entries(people)){

  if(
   p.hidden ||
   p.room!==player.room
  ){
   continue;
  }

  const distance=
  Math.abs(player.x-p.x) +
  Math.abs(player.y-p.y);

  if(distance===1){
   nearbyPerson=name;
  }
 }

 for(const object of rooms[player.room].objects){

  const distance=
  Math.abs(player.x-object.x) +
  Math.abs(player.y-object.y);

  if(distance===1){
   nearbyObject=object;
  }
 }

 const talk=
 document.getElementById('talkBtn');

 const inspect=
 document.getElementById('inspectBtn');

 const listen=
 document.getElementById('listenBtn');

 talk.classList.toggle(
  'hidden',
  !nearbyPerson
 );

 inspect.classList.toggle(
  'hidden',
  !nearbyObject
 );

 if(nearbyPerson){
  talk.textContent=
  '💬 '+nearbyPerson;
 }

 if(nearbyObject){
  inspect.textContent=
  '🔎 '+nearbyObject.name;
 }

 listen.classList.toggle(
  'hidden',
  !(
   theft &&
   day>=2 &&
   player.room==='Staff Hall'
  )
 );
}

/* =====================
   SEARCHING
===================== */

function inspectObject(){

 if(!nearbyObject){
  return;
 }

 paused=true;

 const object=
 nearbyObject;

 const text=
 theft
 ? (
   object.post ||
   object.pre ||
   'Nothing useful.'
  )
 : (
   object.pre ||
   'Nothing important yet.'
  );

 message(`
 <b>${object.icon} ${object.name}</b>

 <br><br>

 ${text}
 `);

 if(
  theft &&
  object.clue
 ){

  addEvidence(
   object.clue
  );
 }

 const searchName=
 player.room+' — '+object.name;

 if(!searched.includes(searchName)){

  searched.push(searchName);
 }

 minutes+=4;

 paused=false;

 draw();
}

/* =====================
   NOTEBOOK DATA
===================== */

function addEvidence(text){

 if(!evidence.includes(text)){

  evidence.push(text);

  document.getElementById('message').innerHTML+=
  `<br><br>📓 <b>Evidence added!</b>`;
 }
}


function addNote(text){

 if(!notes.includes(text)){

  notes.push(text);
 }
}


function hasEvidence(word){

 return evidence.some(item=>
  item.toLowerCase().includes(
   word.toLowerCase()
  )
 );
}


/* =====================
   UI HELPERS
===================== */

function showChoices(items){

 const choices=
 document.getElementById('choices');

 choices.innerHTML='';

 for(const [label,action] of items){

  const button=
  document.createElement('button');

  button.textContent=label;

  button.onclick=action;

  choices.appendChild(button);
 }
}


function clearChoices(){

 document.getElementById('choices').innerHTML='';
}


function message(text){

 document.getElementById('message').innerHTML=text;
}


function hideGame(){

 paused=true;

 document.getElementById('room').style.display='none';

 document.getElementById('controls').style.display='none';

 document.getElementById('choices').style.display='none';

 document.getElementById('message').style.display='none';
}


function showGame(){

 document.getElementById('room').style.display='grid';

 document.getElementById('controls').style.display='block';

 document.getElementById('choices').style.display='block';

 document.getElementById('message').style.display='block';

 paused=false;

 draw();
}


/* =====================
   MAP
===================== */

function openMap(){

 hideGame();

 document.getElementById('map').style.display='block';

 drawMap(
  rooms[player.room].floor
 );
}


function closeMap(){

 document.getElementById('map').style.display='none';

 showGame();
}


function drawMap(floor){

 const names=
 Object.keys(rooms).filter(name=>
  rooms[name].floor===floor
 );

 document.getElementById('mapCards').innerHTML=
 names.map(name=>{

  const seen=
  Object.entries(lastSeen)
  .filter(([person,room])=>
   room===name
  )
  .map(([person])=>person)
  .join(', ');

  return `
  <div class="card ${name===player.room?'current':''}">

   <b>${name}</b>

   ${
    name===player.room
    ? '<br>📍 You are here'
    : ''
   }

   ${
    seen
    ? `<br><span class="small">Last seen: ${seen}</span>`
    : ''
   }

  </div>
  `;
 }).join('');
}

   NOTEBOOK
===================== */

 hideGame();

 document.getElementById('notebook').style.display='block';

 showNotes('people');
}


function closeNotebook(){

 document.getElementById('notebook').style.display='none';

function showNotes(tab){

 const box=
 document.getElementById('noteCards');


 if(tab==='people'){

  box.innerHTML=
  `
  <h3>👥 People</h3>

  <div class="cards">

  ${
   Object.keys(people)
   .map(name=>`

   <div class="card">

   <b>${name}</b>

   <br>

   <span class="small">
   Last seen:
   ${lastSeen[name]||'Unknown'}
   </span>

   </div>

   `)
   .join('')
  }

  </div>
  `;
 }


 if(tab==='evidence'){

  box.innerHTML=
  `
  <h3>🔎 Evidence</h3>

  ${
   evidence.length
   ? evidence.map(item=>
     `<div class="card">${item}</div>`
    ).join('')
   : '<div class="card">Nothing yet.</div>'
  }

  <h3>📝 Notes</h3>

  ${

     `<div class="card">${item}</div>`
    ).join('')

  }

  <h3>🚪 Searched</h3>

  ${

   ? searched.map(item=>
     `<div class="card">${item}</div>`
    ).join('')
   : '<div class="card">Nothing searched yet.</div>'
  }
  `;
 }


 if(tab==='leads'){

  box.innerHTML=
  `
  <h3>🧭 Leads</h3>

  <div class="card">
  ${
   theft
   ? '❓ Who could use the hotel master keys?'
   : '⏳ Meet people before the gala.'
  }
  </div>

  ${
   theft
   ? `

   ${
    hasEvidence('photo')

    : '❓'
   }
   Felix took photographs.
   </div>

   <div class="card">
   ${
    hasEvidence('velvet')
    ? '✅'
    : '❓'
   }
   Find the blue pouch.
   </div>

   <div class="card">
   ${
    hasEvidence('Room 13')
    ? '✅'
    : '❓'
   }
   Why is Room 13 important?
   </div>

   <div class="card">
   💬 Keep talking to Maya on different days.
   </div>

   `
   : ''
  }
  `;
 }


 if(tab==='accuse'){

  if(!theft){

   box.innerHTML=
   `
   <div class="card">
   There has not been a crime yet. 😂
   </div>
   `;

   return;
  }

  const names=
  Object.keys(people)
  .filter(name=>
   name!=='Detective Grimble'
  );

  box.innerHTML=
  `
  <h3>⚖️ Accuse</h3>

  <div class="card">

  Mastermind:

  <option value="">

  ${
   names.map(name=>
    `<option>${name}</option>`

  Accomplice:

  <br>

  <select id="helper">

  <option value="">
  Choose
  </option>

   names.map(name=>
    `<option>${name}</option>`
   ).join('')
  }

  </select>

  <br><br>

  <button onclick="accuse()">
  Present case
  </button>

  </div>
  `;
 }
}


/* =====================
   FINAL ACCUSATION
===================== */

function accuse(){

 const master=
 document.getElementById('master').value;

 const helper=
 document.getElementById('helper').value;

 const strongEvidence=

 hasEvidence('master key') &&

 hasEvidence('blue pouch') &&

 (
  hasEvidence('dark-teal') ||
  hasEvidence('teal uniform')
 ) &&

 (
  hasEvidence('Harris') ||
  hasEvidence('staff-stair')
 );


 if(
  master==='Mrs Bell' &&
  helper==='Mr Harris' &&
  strongEvidence
 ){

  gameOver=true;

  document.getElementById('noteCards').innerHTML=
  `
  <h2>🎉 CASE SOLVED!</h2>

  <div class="card">

  Mrs Bell planned the theft.

  <br><br>

  Mr Harris helped move and hide the diamond.

  <br><br>

  Maya carried the pouch without knowing
  what it contained.

  <br><br>

  Grimble:

  “Exactly what I was about to say.”

  <br><br>

  Maya:

  “No you weren't.”

  😂

  <br><br>

  💎 The diamond is recovered!

  </div>
  `;

 }else if(
  master==='Mrs Bell' &&
  helper==='Mr Harris'
 ){

  document.getElementById('noteCards').innerHTML=
  `
  <div class="card">

  Your theory may be right,
  but you need stronger proof.

  <br><br>

  Look for:

  <br><br>

  🔑 master-key evidence

  <br>

  🛍️ blue-pouch evidence

  <br>

  👕 teal clothing

  <br>

  👞 evidence connecting Harris

  </div>

  <button onclick="showNotes('accuse')">

 }else{

  `

  Keep investigating.

}
